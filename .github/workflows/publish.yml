name: Release @todoist/eslint-plugin-doist package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      operation:
        description: Pack only, or publish a retained artifact (select its original version tag)
        type: choice
        options: [pack, npm, github, both]
        default: pack
      dist_tag:
        description: Use recovery for an older missing mirror without changing latest
        type: choice
        options: [latest, recovery]
        default: latest
      artifact_run_id:
        description: Original successful pack run ID; required for publication/retry
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-eslint-plugin-doist
  cancel-in-progress: false

jobs:
  pack:
    if: (github.event_name == 'push' || inputs.operation == 'pack') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check release tag matches manifest
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      # Plain JavaScript package: no build, dependency install, lifecycle or registry writes needed.
      - name: Pack once and record checksums
        run: node .github/scripts/release.mjs pack "$RUNNER_TEMP/release-artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: eslint-plugin-doist-release
          path: ${{ runner.temp }}/release-artifacts/
          if-no-files-found: error
          retention-days: 90

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'pack'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin npm with trusted-publishing support
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Validate source run and version tag
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          test "$GITHUB_REPOSITORY" = todoist/eslint-plugin-doist
          test "$GITHUB_REF" = "refs/tags/v$(node -p "require('./package.json').version")"
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" > "$RUNNER_TEMP/main-ancestry.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const run = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/source-run.json`));
          assert.equal(run.repository.full_name, process.env.GITHUB_REPOSITORY);
          assert.equal(run.head_repository.full_name, process.env.GITHUB_REPOSITORY);
          assert(['main', process.env.GITHUB_REF_NAME].includes(run.head_branch));
          assert.equal(run.path, '.github/workflows/publish.yml');
          assert.equal(run.head_sha, process.env.GITHUB_SHA);
          assert.equal(run.conclusion, 'success');
          assert(['push', 'workflow_dispatch'].includes(run.event));
          const ancestry = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/main-ancestry.json`));
          assert(['ahead', 'identical'].includes(ancestry.status), 'Artifact commit must be on reviewed main history');
          JS
      - uses: actions/download-artifact@v4
        with:
          name: eslint-plugin-doist-release
          path: ${{ runner.temp }}/release-artifacts/
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Verify retained artifact
        run: node .github/scripts/release.mjs verify "$RUNNER_TEMP/release-artifacts"
      - name: Publish or verify npm artifact
        env:
          RELEASE_DIST_TAG: ${{ inputs.dist_tag }}
        if: inputs.operation == 'npm' || inputs.operation == 'both'
        run: node .github/scripts/release.mjs publish "$RUNNER_TEMP/release-artifacts" npm
      - name: Publish or verify GitHub mirror
        if: inputs.operation == 'github' || inputs.operation == 'both'
        run: node .github/scripts/release.mjs publish "$RUNNER_TEMP/release-artifacts" github
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DIST_TAG: ${{ inputs.dist_tag }}
