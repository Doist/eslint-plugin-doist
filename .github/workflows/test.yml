name: Test supported ESLint versions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '24.10.0']
        eslint: ['8.57.0', '9.0.0', '9']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select supported ESLint without changing the lockfile
        env:
          ESLINT_VERSION: ${{ matrix.eslint }}
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "eslint@$ESLINT_VERSION"
      - run: npm run lint
      - run: npm test
